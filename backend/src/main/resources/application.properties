spring.application.name=backend
server.port=8080

# In-Memory & File Database Configuration for Seamless Dummy Testing
spring.datasource.url=jdbc:h2:file:./data/student_performance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MySQL Production Configuration (Uncomment to use local MySQL database)
# spring.datasource.url=jdbc:mysql://localhost:3306/student_performance_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=Pari@123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Interactive Web Database Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON formatting
spring.jackson.serialization.indent_output=true